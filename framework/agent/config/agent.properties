###############################################################################
# OFBiz Agent configuration
###############################################################################

# OpenAI-compatible endpoint used by the agent runtime.
agent.llm.baseUrl=http://192.168.56.1:8000/v1

# Model exposed by the local OpenAI-compatible endpoint.
agent.llm.model=Qwen/Qwen3-14B-AWQ

# HTTP connection timeout in milliseconds.
agent.llm.connectTimeoutMillis=5000

# Maximum duration of a single LLM request in milliseconds.
agent.llm.requestTimeoutMillis=120000

###############################################################################
# Agent tracing
###############################################################################

# operational | diagnostic
agent.trace.level=diagnostic

# off | metadata | full
agent.trace.payload=full
